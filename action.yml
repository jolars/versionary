name: Versionary Action
description: Run Versionary release orchestration with machine-readable outputs
author: Johan Larsson
branding:
  icon: git-branch
  color: gray-dark
inputs:
  token:
    description: GitHub token used by Versionary SCM integration
    required: true
  versionary-version:
    description: Versionary npm version or dist-tag
    required: false
    default: 1.3.0
  working-directory:
    description: Working directory containing versionary.jsonc/json
    required: false
    default: .
outputs:
  action:
    description: Versionary action taken (noop, stale-run-skipped, pr-prepared,
      release-published, release-skipped)
  message:
    description: Human-readable result message
  release_created:
    description: Whether this run published at least one release
  tag_name:
    description: Primary release tag (first tag when multiple targets release)
  tag_names:
    description: JSON array of published release tags
  release_targets:
    description: Dependency-ordered JSON array of released package targets
  review_url:
    description: Primary review request URL when release PRs were prepared
  review_requests:
    description: JSON array of prepared or reconciled release review requests
  branch:
    description: Primary release branch name when release PRs were prepared
  title:
    description: Primary release PR title when release PRs were prepared
runs:
  using: node24
  main: action/index.js
